workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120

    environment:
      xcode: 26.4
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.airfeather.app
      groups:
        - Air

    scripts:
      - name: Pull Git LFS files
        script: |
          set -e
          git lfs install
          git lfs pull
          ls -lh Frameworks/UnityRuntime.framework/UnityRuntime

      - name: Sanity check env
        script: |
          set -e
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || (echo "ISSUER_ID empty" && exit 1)
          test -n "$APP_STORE_CONNECT_KEY_ID" || (echo "KEY_ID empty" && exit 1)
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY" || (echo "PRIVATE_KEY empty" && exit 1)

      - name: Fetch signing files
        script: |
          set -e
          app-store-connect fetch-signing-files \
            "com.airfeather.app" \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create

      - name: Setup keychain
        script: |
          set -e
          keychain initialize
          keychain add-certificates

      - name: Apply provisioning to project
        script: |
          set -e
          xcode-project use-profiles --project "Unity-iPhone.xcodeproj"

      - name: Set UnityRuntime MinimumOSVersion to 17.0
        script: |
          set -e
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 17.0" Frameworks/UnityRuntime.framework/Info.plist
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" Frameworks/UnityRuntime.framework/Info.plist

      - name: Build iOS ipa
        script: |
          set -e
          xcode-project build-ipa \
            --project "Unity-iPhone.xcodeproj" \
            --scheme "Unity-iPhone" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/logs/*.log
      - $HOME/Library/Logs/xcodebuild/*.log

    publishing:
      app_store_connect:
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        key_id: $APP_STORE_CONNECT_KEY_ID
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        submit_to_testflight: true
        submit_to_app_store: false
